<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Task Sorter">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Task Sorter</title>
</head>
<body>
  <div id="app"></div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <template id="confirm-template">
    <div class="modal-backdrop">
      <div class="modal-card">
        <h3 id="confirm-title">Подтверждение</h3>
        <p id="confirm-text"></p>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="confirm-cancel">Отмена</button>
          <button class="btn btn-danger" id="confirm-ok">Удалить</button>
        </div>
      </div>
    </div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
