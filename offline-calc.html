<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc Offline">
<title>Calc Offline</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111318;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom))}
.wrap{width:min(420px,100%)}
.badge{color:#9da6b6;font-size:13px;margin-bottom:10px}
.calc{background:#1a1e25;border:1px solid #ffffff15;border-radius:22px;padding:16px;box-shadow:0 20px 60px #0006}
.screen{background:#0d0f13;border-radius:16px;padding:18px;margin-bottom:14px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.expr{color:#8f98a8;font-size:16px;min-height:22px;word-break:break-all}
.result{font-size:38px;font-weight:800;line-height:1.1;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:16px;min-height:64px;background:#282e39;color:white;font-size:23px;font-weight:700}
button:active{transform:scale(.97)}
.op{background:#5f76ff}
.danger{background:#e45a67}
.wide{grid-column:span 2}
.status{margin-top:12px;color:#98a1b0;text-align:center;font-size:13px}
.offline{color:#56d197}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">OFFLINE TEST APP</div>
  <div class="calc">
    <div class="screen">
      <div id="expr" class="expr">&nbsp;</div>
      <div id="result" class="result">0</div>
    </div>
    <div class="grid">
      <button class="danger" onclick="clearAll()">C</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="press('%')">%</button>
      <button class="op" onclick="press('/')">÷</button>

      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="op" onclick="press('*')">×</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="op" onclick="press('-')">−</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="op" onclick="press('+')">+</button>

      <button class="wide" onclick="press('0')">0</button>
      <button onclick="press('.')">,</button>
      <button class="op" onclick="calculate()">=</button>
    </div>
    <div id="status" class="status">Подготовка офлайн-режима…</div>
  </div>
</div>

<script>
let expression = "";

function render(){
  document.getElementById("expr").textContent = expression || "\u00A0";
}

function press(v){
  expression += v;
  render();
}

function clearAll(){
  expression = "";
  document.getElementById("result").textContent = "0";
  render();
}

function backspace(){
  expression = expression.slice(0,-1);
  render();
}

function calculate(){
  if(!expression) return;
  try{
    if(!/^[0-9+\-*/%.() ]+$/.test(expression)) throw new Error("bad");
    let normalized = expression.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");
    const value = Function('"use strict";return (' + normalized + ')')();
    if(!Number.isFinite(value)) throw new Error("bad");
    const out = Math.round((value + Number.EPSILON) * 10000000000) / 10000000000;
    document.getElementById("result").textContent = String(out).replace(".",",");
  }catch(e){
    document.getElementById("result").textContent = "Ошибка";
  }
}

window.addEventListener("load", async () => {
  const status = document.getElementById("status");

  if(!("serviceWorker" in navigator)){
    status.textContent = "Service Worker не поддерживается";
    return;
  }

  try{
    const reg = await navigator.serviceWorker.register("./sw-offline-calc.js");
    await navigator.serviceWorker.ready;
    status.textContent = navigator.onLine
      ? "Офлайн-режим готов. Теперь можно отключить интернет."
      : "Работает офлайн";
    status.classList.add("offline");
  }catch(e){
    status.textContent = "Ошибка офлайн-режима: " + e.message;
  }
});

window.addEventListener("online", () => {
  const s=document.getElementById("status");
  s.textContent="Офлайн-режим готов. Теперь можно отключить интернет.";
  s.classList.add("offline");
});
window.addEventListener("offline", () => {
  const s=document.getElementById("status");
  s.textContent="Работает офлайн";
  s.classList.add("offline");
});
</script>
</body>
</html>
