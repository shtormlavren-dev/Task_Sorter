<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Sorter GTD">
<title>Task Sorter GTD</title>
<style>
:root{--bg:#101217;--panel:#191d24;--panel2:#232934;--text:#f3f5f8;--muted:#9da6b6;--accent:#6c7fff;--danger:#e55c68;--ok:#47ca8c;--border:#ffffff14}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100dvh}
button,input,textarea,select{font:inherit}.app{max-width:1100px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 13px max(24px,env(safe-area-inset-bottom))}
.top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.top h1{font-size:24px;margin:0}.spacer{flex:1}
.btn{border:0;border-radius:13px;background:var(--accent);color:white;padding:12px 14px;font-weight:750;min-height:44px}.secondary{background:var(--panel2)}.danger{background:var(--danger)}.ok{background:var(--ok);color:#07150e}.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.hero{padding:8px 2px 19px}.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.02;letter-spacing:-.05em;margin:5px 0}.hero p,.muted,.small{color:var(--muted)}.small{font-size:13px}.kicker{font-size:12px;color:#a8b2ff;font-weight:800;letter-spacing:.11em}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,var(--panel),#151920);border:1px solid var(--border);border-radius:17px;padding:17px;text-align:left;color:var(--text);min-height:122px}.card strong{display:block;font-size:18px;margin-bottom:7px}.card span{display:block;color:var(--muted);font-size:13px;line-height:1.35}.count{margin-top:12px;color:#9eacff;font-weight:800}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:17px}.field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px;outline:none}textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.capture,.process{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.listbox{max-height:65dvh;overflow:auto}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border)}.num{color:var(--muted);min-width:27px;text-align:right}.title{font-weight:800}.comment{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap}.x{width:34px;height:34px;border:0;border-radius:10px;background:#e55c6826;color:#ff7b87;font-size:18px;font-weight:900}
.empty{padding:28px 15px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:15px}.taskbig{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:20px;position:sticky;top:10px}.taskbig h2{font-size:clamp(28px,5vw,40px);line-height:1.05;margin:8px 0 14px}
.gtdgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gtdbtn{background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:13px;text-align:left}.gtdbtn strong{display:block}.gtdbtn span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.tasklist{display:flex;flex-direction:column;gap:7px}.taskrow{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{border-radius:999px;background:var(--panel2);color:var(--muted);font-size:11px;padding:5px 8px}
.folders,.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.folder,.project{background:var(--panel);border:1px solid var(--border);border-radius:15px;color:var(--text);padding:15px;text-align:left;position:relative;overflow:hidden}.bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}.folder strong{margin-left:4px}.folder small{display:block;color:var(--muted);margin:6px 0 0 4px}
.section{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}.section h2{margin:0;font-size:20px}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.dow{text-align:center;color:var(--muted);font-size:11px}.day{min-height:64px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px}.day.other{opacity:.35}.day.sel{border-color:var(--accent)}.day.today{color:#a8b2ff;font-weight:900}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:14px;z-index:99}.modalbox{width:min(520px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}
@media(max-width:850px){.menu{grid-template-columns:repeat(2,1fr)}.capture,.process{grid-template-columns:1fr}.taskbig{position:static}}
@media(max-width:560px){.menu,.gtdgrid,.folders,.projects{grid-template-columns:1fr}.card{min-height:102px}.day{min-height:55px;padding:5px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const KEY="taskSorterGTD_FRESH_v1", OLD=["taskSorterGTD_v1","taskSorterDataV4","taskSorterDataV3","taskSorterDataV2"];
let data=loadData(), currentInboxId=null, calMonth=new Date(), selectedDate=dateKey(new Date());

function el(id){return document.getElementById(id)}
function blank(){return{version:6,folders:[],projects:[],tasks:[]}}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9)}
function normalize(x){
  x=x||blank(); x.folders=Array.isArray(x.folders)?x.folders:[]; x.projects=Array.isArray(x.projects)?x.projects:[]; x.tasks=Array.isArray(x.tasks)?x.tasks:[];
  x.tasks=x.tasks.map(t=>({id:t.id||uid(),title:t.title||"",comment:t.comment||"",folderId:t.folderId||null,projectId:t.projectId||null,gtd:t.gtd||(!t.folderId?"inbox":"next"),dueDate:t.dueDate||"",today:!!t.today,delegatedTo:t.delegatedTo||"",completed:!!t.completed,createdAt:t.createdAt||new Date().toISOString()}));
  return x
}
function loadData(){
  try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return normalize(x)}catch(e){}
  for(const k of OLD){try{const x=JSON.parse(localStorage.getItem(k));if(x){const n=normalize(x);localStorage.setItem(KEY,JSON.stringify(n));return n}}catch(e){}}
  return blank()
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=""){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function dateKey(d){const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function todayKey(){return dateKey(new Date())}
function fmt(s){if(!s)return"";const a=s.split("-");return `${a[2]}.${a[1]}.${a[0]}`}
function t(id){return data.tasks.find(x=>x.id===id)} function p(id){return data.projects.find(x=>x.id===id)} function f(id){return data.folders.find(x=>x.id===id)}
function listGtd(g){return data.tasks.filter(x=>!x.completed&&x.gtd===g)}
function inbox(){return listGtd("inbox")} function next(){return listGtd("next")} function waiting(){return listGtd("waiting")} function someday(){return listGtd("someday")} function reference(){return listGtd("reference")}
function today(){return data.tasks.filter(x=>!x.completed&&(x.today||x.dueDate===todayKey()))}
function projectTasks(id){return data.tasks.filter(x=>!x.completed&&x.projectId===id)}
function folderTasks(id){return data.tasks.filter(x=>!x.completed&&x.folderId===id)}
function top(title,back="menu",extra=""){return `<div class="top">${back?`<button class="btn secondary" onclick="${back}()">← Назад</button>`:""}<h1>${esc(title)}</h1><div class="spacer"></div>${extra}</div>`}
function setHtml(s){el("app").innerHTML=s}
function gtdName(g){return({inbox:"Входящие",next:"Следующее действие",waiting:"Поручено / ожидаю",calendar:"Календарь",someday:"Когда-нибудь",reference:"Хранилище"})[g]||g}
function taskRow(x){
  let chips=[];
  if(x.today||x.dueDate===todayKey())chips.push(`<span class="chip">Сегодня</span>`);
  if(x.dueDate)chips.push(`<span class="chip">📅 ${fmt(x.dueDate)}</span>`);
  if(x.projectId&&p(x.projectId))chips.push(`<span class="chip">Проект: ${esc(p(x.projectId).name)}</span>`);
  if(x.folderId&&f(x.folderId))chips.push(`<span class="chip">${esc(f(x.folderId).name)}</span>`);
  if(x.gtd==="waiting")chips.push(`<span class="chip">Ожидаю${x.delegatedTo?": "+esc(x.delegatedTo):""}</span>`);
  return `<div class="taskrow" onclick="editTask('${x.id}')"><div class="title">${esc(x.title)}</div>${x.comment?`<div class="comment">${esc(x.comment)}</div>`:""}<div class="meta">${chips.join("")}</div></div>`
}
function modal(content){document.body.insertAdjacentHTML("beforeend",`<div id="modal" class="modal"><div class="modalbox">${content}</div></div>`)}
function closeModal(){el("modal")?.remove()}

function menu(){
  setHtml(`<div class="hero"><div class="kicker">TASK SORTER · GTD</div><h1>Собрал → уточнил → сделал.</h1><p>Быстрый ввод и GTD в одном офлайн-приложении.</p></div>
  <div class="menu">
    <button class="card" onclick="capture()"><strong>Быстрый ввод</strong><span>Задача → комментарий → следующая.</span><div class="count">${inbox().length} входящих</div></button>
    <button class="card" onclick="processInbox()"><strong>Разобрать входящие</strong><span>Разбираем по одному пункту.</span><div class="count">${inbox().length?`Разобрать: ${inbox().length}`:"Пусто"}</div></button>
    <button class="card" onclick="showSimple('Сегодня',today())"><strong>Сегодня</strong><span>То, что актуально сегодня.</span><div class="count">${today().length}</div></button>
    <button class="card" onclick="showSimple('Следующие действия',next())"><strong>Следующие действия</strong><span>Конкретные шаги.</span><div class="count">${next().length}</div></button>
    <button class="card" onclick="projectsView()"><strong>Проекты</strong><span>Результаты из нескольких действий.</span><div class="count">${data.projects.filter(x=>x.status!=='done').length}</div></button>
    <button class="card" onclick="showSimple('Поручено / ожидаю',waiting())"><strong>Поручено / ожидаю</strong><span>То, что передано другим.</span><div class="count">${waiting().length}</div></button>
    <button class="card" onclick="calendarView()"><strong>Календарь</strong><span>Задачи на конкретные даты.</span></button>
    <button class="card" onclick="showSimple('Когда-нибудь',someday())"><strong>Когда-нибудь</strong><span>Идеи без обязательства сейчас.</span><div class="count">${someday().length}</div></button>
    <button class="card" onclick="showSimple('Хранилище',reference())"><strong>Хранилище</strong><span>Справочная информация.</span><div class="count">${reference().length}</div></button>
    <button class="card" onclick="allTasks()"><strong>Все задачи</strong><span>Полная база и поиск.</span><div class="count">${data.tasks.filter(x=>!x.completed).length}</div></button>
    <button class="card" onclick="foldersView()"><strong>Папки / контексты</strong><span>Работа, покупки, 3D и т. д.</span><div class="count">${data.folders.length}</div></button>
    <button class="card" onclick="backupView()"><strong>Резервная копия</strong><span>Экспорт / импорт базы.</span></button>
  </div>`)
}

function capture(){
  setHtml(`${top("Быстрый ввод")}<div class="capture">
    <div class="panel"><div class="muted" style="margin-bottom:12px">Название → Enter. Комментарий → Enter. Shift+Enter = перенос строки.</div>
      <div class="field"><label>Задача</label><input id="capTitle"></div>
      <div class="field"><label>Комментарий</label><textarea id="capComment"></textarea></div>
      <button class="btn" onclick="addCaptured()">Добавить</button>
    </div>
    <div class="panel"><h3>Входящие</h3><div id="capList" class="listbox"></div></div>
  </div>`)
  el("capTitle").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(el("capTitle").value.trim())el("capComment").focus()}})
  el("capComment").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addCaptured()}})
  renderCap();el("capTitle").focus()
}
function addCaptured(){
  const title=el("capTitle").value.trim();if(!title)return alert("Введите название")
  data.tasks.push({id:uid(),title,comment:el("capComment").value.trim(),folderId:null,projectId:null,gtd:"inbox",dueDate:"",today:false,delegatedTo:"",completed:false,createdAt:new Date().toISOString()})
  save();el("capTitle").value="";el("capComment").value="";renderCap();el("capTitle").focus()
}
function renderCap(){
  const a=inbox();el("capList").innerHTML=a.length?a.map((x,i)=>`<div class="item"><div class="num">${i+1}.</div><div><div class="title">${esc(x.title)}</div>${x.comment?`<div class="comment">${esc(x.comment)}</div>`:""}</div><button class="x" onclick="deleteInbox('${x.id}')">×</button></div>`).join(""):`<div class="empty">Входящие пусты</div>`
}
function deleteInbox(id){const x=t(id);if(x&&confirm(`Удалить «${x.title}»?`)){data.tasks=data.tasks.filter(q=>q.id!==id);save();renderCap()}}

function processInbox(){
  const a=inbox();if(!a.length){setHtml(`${top("Разобрать входящие")}<div class="empty">Входящие пусты.</div>`);return}
  let x=t(currentInboxId);if(!x||x.gtd!=="inbox")x=a[0];currentInboxId=x.id
  setHtml(`${top("Разобрать входящие")}<div class="process">
    <div class="taskbig"><div class="small">Осталось: ${a.length}</div><h2>${esc(x.title)}</h2><div class="comment">${esc(x.comment||"Без комментария")}</div><div class="actions"><button class="btn danger" onclick="deleteCurrent()">Удалить</button></div></div>
    <div><h2>Куда отнести?</h2><div class="gtdgrid">
      <button class="gtdbtn" onclick="classify('next')"><strong>Следующее действие</strong><span>Один конкретный шаг.</span></button>
      <button class="gtdbtn" onclick="chooseProjectInbox()"><strong>Часть проекта</strong><span>Отнести к проекту.</span></button>
      <button class="gtdbtn" onclick="classifyWaiting()"><strong>Поручено / ожидаю</strong><span>Передано другому человеку.</span></button>
      <button class="gtdbtn" onclick="classifyCalendar()"><strong>Календарь</strong><span>Есть конкретная дата.</span></button>
      <button class="gtdbtn" onclick="classify('someday')"><strong>Когда-нибудь</strong><span>Не сейчас.</span></button>
      <button class="gtdbtn" onclick="classify('reference')"><strong>Хранилище</strong><span>Это информация, а не действие.</span></button>
    </div></div>
  </div>`)
}
function classify(g){const x=t(currentInboxId);if(!x)return;x.gtd=g;save();currentInboxId=null;processInbox()}
function classifyWaiting(){const x=t(currentInboxId);if(!x)return;const who=prompt("Кому поручено / кого ждём?","");if(who===null)return;x.gtd="waiting";x.delegatedTo=who.trim();save();currentInboxId=null;processInbox()}
function classifyCalendar(){modal(`<h3>Дата</h3><input id="pickDate" type="date" value="${todayKey()}"><div class="actions"><button class="btn" onclick="applyCalendar()">Готово</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)}
function applyCalendar(){const x=t(currentInboxId),d=el("pickDate").value;if(!x||!d)return;x.gtd="calendar";x.dueDate=d;x.today=d===todayKey();save();closeModal();currentInboxId=null;processInbox()}
function chooseProjectInbox(){
  modal(`<h3>Проект</h3><select id="projPick"><option value="">— выбрать —</option>${data.projects.filter(x=>x.status!=="done").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
  <div class="actions"><button class="btn" onclick="applyProjectInbox()">Готово</button><button class="btn secondary" onclick="quickProjectInbox()">+ Новый проект</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)
}
function applyProjectInbox(){const x=t(currentInboxId),pid=el("projPick").value;if(!x||!pid)return alert("Выберите проект");x.projectId=pid;x.gtd="next";save();closeModal();currentInboxId=null;processInbox()}
function quickProjectInbox(){const name=prompt("Название проекта:");if(!name||!name.trim())return;const pr={id:uid(),name:name.trim(),description:"",status:"active"};data.projects.push(pr);const x=t(currentInboxId);x.projectId=pr.id;x.gtd="next";save();closeModal();currentInboxId=null;processInbox()}
function deleteCurrent(){const x=t(currentInboxId);if(x&&confirm(`Удалить «${x.title}»?`)){data.tasks=data.tasks.filter(q=>q.id!==x.id);save();currentInboxId=null;processInbox()}}

function showSimple(title,a){setHtml(`${top(title)}${a.length?`<div class="tasklist">${a.map(taskRow).join("")}</div>`:`<div class="empty">Список пуст.</div>`}`)}
function allTasks(){
  setHtml(`${top("Все задачи")}<div class="panel" style="margin-bottom:10px"><input id="search" placeholder="Поиск"></div><div id="allList" class="tasklist"></div>`)
  el("search").addEventListener("input",renderAll);renderAll()
}
function renderAll(){
  const q=el("search").value.trim().toLowerCase();const a=data.tasks.filter(x=>!x.completed&&(!q||x.title.toLowerCase().includes(q)||(x.comment||"").toLowerCase().includes(q)))
  el("allList").innerHTML=a.length?a.map(taskRow).join(""):`<div class="empty">Ничего не найдено.</div>`
}

function editTask(id){
  const x=t(id);if(!x)return
  modal(`<h3>Редактирование</h3>
  <div class="field"><label>Название</label><input id="eTitle" value="${esc(x.title)}"></div>
  <div class="field"><label>Комментарий</label><textarea id="eComment">${esc(x.comment||"")}</textarea></div>
  <div class="field"><label>GTD</label><select id="eGtd">${["inbox","next","waiting","calendar","someday","reference"].map(g=>`<option value="${g}" ${x.gtd===g?"selected":""}>${gtdName(g)}</option>`).join("")}</select></div>
  <div class="field"><label>Проект</label><select id="eProject"><option value="">Без проекта</option>${data.projects.map(pr=>`<option value="${pr.id}" ${x.projectId===pr.id?"selected":""}>${esc(pr.name)}</option>`).join("")}</select></div>
  <div class="field"><label>Папка</label><select id="eFolder"><option value="">Без папки</option>${data.folders.map(fl=>`<option value="${fl.id}" ${x.folderId===fl.id?"selected":""}>${esc(fl.name)}</option>`).join("")}</select></div>
  <div class="field"><label>Дата</label><input id="eDate" type="date" value="${x.dueDate||""}"></div>
  <div class="field"><label>Кому поручено</label><input id="eWho" value="${esc(x.delegatedTo||"")}"></div>
  <label><input id="eToday" type="checkbox" style="width:auto" ${x.today?"checked":""}> Сегодня</label>
  <div class="actions"><button class="btn" onclick="saveEdit('${id}')">Сохранить</button><button class="btn ok" onclick="completeTask('${id}')">Выполнено</button><button class="btn danger" onclick="deleteTask('${id}')">Удалить</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)
}
function saveEdit(id){const x=t(id);x.title=el("eTitle").value.trim()||x.title;x.comment=el("eComment").value.trim();x.gtd=el("eGtd").value;x.projectId=el("eProject").value||null;x.folderId=el("eFolder").value||null;x.dueDate=el("eDate").value;x.delegatedTo=el("eWho").value.trim();x.today=el("eToday").checked;save();closeModal();menu()}
function completeTask(id){const x=t(id);x.completed=true;save();closeModal();menu()}
function deleteTask(id){const x=t(id);if(x&&confirm(`Удалить «${x.title}»?`)){data.tasks=data.tasks.filter(q=>q.id!==id);save();closeModal();menu()}}

function projectsView(){
  const a=data.projects.filter(x=>x.status!=="done")
  setHtml(`${top("Проекты","menu",`<button class="btn" onclick="newProject()">+ Проект</button>`)}${a.length?`<div class="projects">${a.map(pr=>`<button class="project" onclick="openProject('${pr.id}')"><h3>${esc(pr.name)}</h3><div class="small">${projectTasks(pr.id).length} действий</div></button>`).join("")}</div>`:`<div class="empty">Проектов пока нет.</div>`}`)
}
function newProject(){modal(`<h3>Новый проект</h3><div class="field"><label>Название</label><input id="pName"></div><div class="field"><label>Описание</label><textarea id="pDesc"></textarea></div><div class="actions"><button class="btn" onclick="saveProject()">Создать</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)}
function saveProject(){const name=el("pName").value.trim();if(!name)return alert("Введите название");data.projects.push({id:uid(),name,description:el("pDesc").value.trim(),status:"active"});save();closeModal();projectsView()}
function openProject(id){const pr=p(id),a=projectTasks(id);if(!pr)return projectsView();setHtml(`<div class="top"><button class="btn secondary" onclick="projectsView()">← Проекты</button><h1>${esc(pr.name)}</h1><div class="spacer"></div><button class="btn" onclick="newProjectTask('${id}')">+ Действие</button></div><div class="panel">${esc(pr.description||"Без описания")}</div><div class="section"><h2>Действия</h2></div>${a.length?`<div class="tasklist">${a.map(taskRow).join("")}</div>`:`<div class="empty">Нет действий.</div>`}`)}
function newProjectTask(pid){modal(`<h3>Новое действие</h3><input id="pt"><textarea id="pc" placeholder="Комментарий"></textarea><div class="actions"><button class="btn" onclick="saveProjectTask('${pid}')">Добавить</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)}
function saveProjectTask(pid){const title=el("pt").value.trim();if(!title)return;data.tasks.push({id:uid(),title,comment:el("pc").value.trim(),folderId:null,projectId:pid,gtd:"next",dueDate:"",today:false,delegatedTo:"",completed:false,createdAt:new Date().toISOString()});save();closeModal();openProject(pid)}

function foldersView(){
  setHtml(`${top("Папки / контексты","menu",`<button class="btn" onclick="newFolder()">+ Папка</button>`)}${data.folders.length?`<div class="folders">${data.folders.map(fl=>`<button class="folder" style="--c:${fl.color||"#6c7fff"}" onclick="openFolder('${fl.id}')"><div class="bar"></div><strong>${esc(fl.name)}</strong><small>${folderTasks(fl.id).length} задач</small></button>`).join("")}</div>`:`<div class="empty">Папок нет.</div>`}`)
}
function newFolder(){modal(`<h3>Новая папка</h3><input id="fName" placeholder="Название"><textarea id="fDesc" placeholder="Описание"></textarea><input id="fColor" type="color" value="#6c7fff"><div class="actions"><button class="btn" onclick="saveFolder()">Создать</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)}
function saveFolder(){const name=el("fName").value.trim();if(!name)return;data.folders.push({id:uid(),name,description:el("fDesc").value.trim(),color:el("fColor").value});save();closeModal();foldersView()}
function openFolder(id){const fl=f(id),a=folderTasks(id);if(!fl)return foldersView();setHtml(`<div class="top"><button class="btn secondary" onclick="foldersView()">← Папки</button><h1>${esc(fl.name)}</h1></div><div class="panel muted">${esc(fl.description||"Без описания")}</div><div class="section"><h2>Задачи</h2></div>${a.length?`<div class="tasklist">${a.map(taskRow).join("")}</div>`:`<div class="empty">Пусто.</div>`}`)}

function calendarView(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate()
  let cells=[]
  for(let i=0;i<42;i++){let day=i-start+1,cm=m,cy=y,other=false;if(day<1){day=prev+day;cm--;other=true;if(cm<0){cm=11;cy--}}else if(day>days){day-=days;cm++;other=true;if(cm>11){cm=0;cy++}}const key=dateKey(new Date(cy,cm,day)),cnt=data.tasks.filter(x=>!x.completed&&x.dueDate===key).length;cells.push(`<button class="day ${other?"other":""} ${key===selectedDate?"sel":""} ${key===todayKey()?"today":""}" onclick="selectDay('${key}')"><div>${day}</div><div class="dots">${Array.from({length:Math.min(cnt,5)},()=>'<span class="dot"></span>').join("")}</div></button>`)}
  const mn=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],a=data.tasks.filter(x=>!x.completed&&x.dueDate===selectedDate)
  setHtml(`${top("Календарь")}<div class="panel"><div class="calhead"><button class="btn secondary" onclick="shiftMonth(-1)">←</button><h2>${mn[m]} ${y}</h2><button class="btn secondary" onclick="shiftMonth(1)">→</button></div><div class="calendar">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells.join("")}</div></div><div class="section"><h2>${fmt(selectedDate)}</h2><button class="btn" onclick="newCalTask('${selectedDate}')">+ Запись</button></div>${a.length?`<div class="tasklist">${a.map(taskRow).join("")}</div>`:`<div class="empty">На эту дату ничего нет.</div>`}`)
}
function shiftMonth(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);calendarView()}
function selectDay(d){selectedDate=d;calendarView()}
function newCalTask(d){modal(`<h3>Новая запись</h3><input id="calTitle"><textarea id="calComment" placeholder="Комментарий"></textarea><div class="actions"><button class="btn" onclick="saveCalTask('${d}')">Добавить</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`)}
function saveCalTask(d){const title=el("calTitle").value.trim();if(!title)return;data.tasks.push({id:uid(),title,comment:el("calComment").value.trim(),folderId:null,projectId:null,gtd:"calendar",dueDate:d,today:d===todayKey(),delegatedTo:"",completed:false,createdAt:new Date().toISOString()});save();closeModal();calendarView()}

function backupView(){setHtml(`${top("Резервная копия")}<div class="panel"><button class="btn" onclick="exportData()">Скачать JSON</button><hr><input id="importFile" type="file" accept=".json"><button class="btn danger" style="margin-top:10px" onclick="importData()">Восстановить</button></div>`)}
function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="task-sorter-gtd-backup.json";a.click()}
async function importData(){const file=el("importFile").files[0];if(!file)return;try{const x=normalize(JSON.parse(await file.text()));if(confirm("Заменить текущую базу?")){data=x;save();menu()}}catch(e){alert("Неверный файл")}}

menu();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw-gtd.js").catch(console.error)}
</script>
</body>
</html>
